<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Other Designs — Jewels Kaiyue Zhu</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #2b2b2b;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #e8e8e8;
        padding: 32px 16px 64px;
      }
      header {
        text-align: center;
        margin-bottom: 32px;
      }
      header h1 {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      header p {
        margin-top: 6px;
        font-size: 14px;
        color: #a9a9a9;
      }
      .doc {
        max-width: 820px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .doc img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 6px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        background: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Other Designs</h1>
      <p>Jewels Kaiyue Zhu — selected social &amp; event graphics</p>
    </header>
    <main class="doc">
      <img src="/projects/od1.jpg" alt="Battle of the Classes — Halftime Relay" />
      <img src="/projects/od2.png" alt="Student Orgs @JHU" />
      <img src="/projects/od3.png" alt="2026 Student Leadership Awards" />
      <img src="/projects/od4.png" alt="Leadership Awards — Award categories" />
      <img src="/projects/od5.png" alt="Leadership Awards — You can nominate" />
    </main>
  </body>
</html>
